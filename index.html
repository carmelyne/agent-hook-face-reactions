<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Command Deck Robot</title>
    <style>
        :root {
            --agent: #00d4ff;
            --agent-dim: rgba(0, 212, 255, 0.25);
            --agent-soft: rgba(0, 212, 255, 0.12);
        }
        body {
            margin: 0;
            background:
                radial-gradient(circle at 50% 42%, var(--agent-dim), transparent 34%),
                radial-gradient(circle at 50% 80%, var(--agent-soft), transparent 32%),
                #050708;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 32px;
            min-height: 100vh;
            box-sizing: border-box;
            padding-block: 150px;
            overflow-y: auto;
            transition: background 420ms ease;
            font-family: ui-rounded, "SF Pro Rounded", "Avenir Next", sans-serif;
        }
        .stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 32px;
            max-height: 92vh;
            transform: scale(var(--stage-scale, 1));
            transform-origin: center center;
        }
        .robot-wrap {
            animation: idle-float 3.8s ease-in-out infinite;
            transform-origin: center bottom;
        }
        .robot-wrap.bounce {
            animation: pop-bounce 560ms cubic-bezier(.18, .9, .25, 1.2), idle-float 3.8s ease-in-out 560ms infinite;
        }
        .robot-svg {
            width: min(76vw, 580px, 66vh);
            height: auto;
            filter: drop-shadow(0 18px 34px rgba(0, 0, 0, 0.42)) drop-shadow(0 0 24px var(--agent-dim));
        }
        .face { display: none; }
        /* Robot Shell Colors */
        .shell { fill: #eff3f0; stroke: #26312c; stroke-width: 3; }
        .shell-shadow { fill: #cfd8d3; opacity: 0.55; }
        .visor { fill: #101615; stroke: rgba(255, 255, 255, 0.1); stroke-width: 2; }
        .antenna { stroke: #26312c; stroke-width: 4; stroke-linecap: round; }
        .agent { fill: var(--agent); stroke: var(--agent); stroke-width: 2; stroke-linecap: round; }
        .agent-text { fill: var(--agent); stroke: none; }
        .agent-stroke { stroke: var(--agent); stroke-linecap: round; }
        .agent-glow { filter: drop-shadow(0 0 8px var(--agent)); }
        .agent-label {
            min-width: 168px;
            padding: 8px 20px 10px;
            border: 1px solid color-mix(in srgb, var(--agent) 62%, transparent);
            border-radius: 999px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.03));
            box-shadow: 0 0 26px var(--agent-soft), inset 0 0 18px rgba(255, 255, 255, 0.04);
            color: var(--agent);
            font-size: clamp(20px, 4vw, 34px);
            font-weight: 800;
            letter-spacing: 0;
            text-align: center;
            text-transform: uppercase;
            text-shadow: 0 0 22px var(--agent-dim);
            transition: color 260ms ease, border-color 260ms ease, box-shadow 260ms ease;
        }
        .agent-label.bounce {
            animation: label-bounce 560ms cubic-bezier(.18, .9, .25, 1.2);
        }
        @keyframes idle-float {
            0%, 100% { transform: translateY(0) rotate(-0.4deg); }
            50% { transform: translateY(-7px) rotate(0.4deg); }
        }
        @keyframes pop-bounce {
            0% { transform: translateY(0) scale(1); }
            34% { transform: translateY(-18px) scale(1.045, 0.96); }
            62% { transform: translateY(4px) scale(0.98, 1.025); }
            82% { transform: translateY(-4px) scale(1.012); }
            100% { transform: translateY(0) scale(1); }
        }
        @keyframes label-bounce {
            0% { transform: translateY(0) scale(1); }
            38% { transform: translateY(-8px) scale(1.04); }
            70% { transform: translateY(2px) scale(0.99); }
            100% { transform: translateY(0) scale(1); }
        }
    </style>
</head>

    <script>
        let currentState = '';
        let currentFace = 'happy';
        let currentSource = 'unknown';
        let currentUpdatedAt = 0;
        const colors = {
            codex: ['#48f2a9', 'rgba(72, 242, 169, 0.28)', 'rgba(72, 242, 169, 0.12)'],
            gemini: ['#65adff', 'rgba(101, 173, 255, 0.28)', 'rgba(101, 173, 255, 0.12)'],
            claude: ['#ffbd59', 'rgba(255, 189, 89, 0.28)', 'rgba(255, 189, 89, 0.12)'],
            ollama: ['#00d4ff', 'rgba(0, 212, 255, 0.25)', 'rgba(0, 212, 255, 0.1)'],
            local: ['#00d4ff', 'rgba(0, 212, 255, 0.25)', 'rgba(0, 212, 255, 0.1)'],
            unknown: ['#00d4ff', 'rgba(0, 212, 255, 0.25)', 'rgba(0, 212, 255, 0.1)']
        };
        const labels = {
            codex: 'CODEX',
            gemini: 'GEMINI',
            claude: 'CLAUDE',
            ollama: 'OLLAMA',
            local: 'LOCAL',
            unknown: 'UNKNOWN'
        };
        const robotWrap = document.getElementById('robot-wrap');
        const agentLabel = document.getElementById('agent-label');

        function bounce() {
            robotWrap.classList.remove('bounce');
            agentLabel.classList.remove('bounce');
            void robotWrap.offsetWidth;
            robotWrap.classList.add('bounce');
            agentLabel.classList.add('bounce');
        }

        function applySource(source) {
            const cleanSource = colors[source] ? source : 'unknown';
            if (cleanSource === currentSource) return;

            currentSource = cleanSource;
            const [agent, dim, soft] = colors[cleanSource];
            document.documentElement.style.setProperty('--agent', agent);
            document.documentElement.style.setProperty('--agent-dim', dim);
            document.documentElement.style.setProperty('--agent-soft', soft);
            document.body.dataset.source = cleanSource;
            agentLabel.textContent = labels[cleanSource];
            bounce();
        }

        const faceSets = Array.from(document.querySelectorAll('.face')).reduce((sets, face) => {
            const state = face.dataset.faceSet || face.id;
            sets[state] = sets[state] || [];
            sets[state].push(face.id);
            return sets;
        }, {});
        faceSets.need_info = faceSets['needs-info'];
        faceSets.needs_info = faceSets['needs-info'];
        faceSets.context = faceSets['needs-info'];
        const previewStates = Object.keys(faceSets).filter(state => !['need_info', 'needs_info', 'context'].includes(state));

        function chooseFace(state) {
            const options = faceSets[state] || faceSets.happy;
            const nextFace = options[Math.floor(Math.random() * options.length)];

            if (options.length < 2 || nextFace !== currentFace) return nextFace;
            return options[(options.indexOf(nextFace) + 1) % options.length];
        }

        function applyState(state, updatedAt = 0) {
            const cleanState = faceSets[state] ? state : 'happy';
            const isFreshHookCall = updatedAt && updatedAt !== currentUpdatedAt;
            if (cleanState === currentState && !isFreshHookCall) return;

            currentState = cleanState;
            currentUpdatedAt = updatedAt || currentUpdatedAt;
            currentFace = chooseFace(currentState);
            document.querySelectorAll('.face').forEach(f => f.style.display = 'none');
            document.getElementById(currentFace).style.display = 'block';
            bounce();
        }

        async function updateFace() {
            try {
                const res = await fetch('state.json?t=' + Date.now());
                const payload = await res.json();
                applySource(payload.source);
                applyState(payload.state, payload.updated_at);
            } catch(e) {
                applySource('unknown');
                const previewState = previewStates[Math.floor(Math.random() * previewStates.length)] || 'happy';
                applyState(previewState, Date.now());
            }
        }
        updateFace();
        setInterval(updateFace, 500);
    </script>
